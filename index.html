<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음식점 창업 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://js.arcgis.com/4.33/esri/themes/light/main.css">
<style>
/* 인허가 대장에서 가져온 생각: 흰 종이, 남색 잉크, 판정은 인주색 도장 */
:root{--bg:#f2f4f6;--card:#fff;--ink:#16202a;--sub:#5b6875;--line:#d8dee4;--accent:#1f3a8a;--weak:#e9eefa;
--stamp:#d43d2a;--holdbg:#eef1f4;
/* 색 사전 (개념 하나에 색 하나) */
--open:#22a06b;      /* 개업, 영업 중 */
--closed:#a8412e;    /* 폐업 */
--popup:#a3acb5;     /* 통계에서 뺀 기록 */
--male:#2a78d6;--female:#d55181;
--age:#d99000;--time:#6250d6;--day:#0e9aa7;
--neutral:#b4bcc4}   /* 비교 대상(이전 기간, 전체) */
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--card:#182028;--ink:#e6ebf0;--sub:#95a2af;--line:#2b3641;--accent:#93b2ff;--weak:#1c2942;
--stamp:#ff7a66;--holdbg:#202a34;
--open:#2aa876;--closed:#c2553a;--popup:#5e6a76;--male:#3987e5;--female:#d55181;--age:#c98500;--time:#9085e9;--day:#1d98a6;--neutral:#55616d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.55 "IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 머리 */
header{background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:flex-end;gap:28px;padding:12px 20px 0;flex-wrap:wrap}
header h1{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0 0 11px;white-space:nowrap}
header h1 small{font-size:11.5px;font-weight:500;color:var(--sub);margin-left:6px;letter-spacing:0}
nav{display:flex;gap:4px}
nav button{font-weight:600;font-size:15px;border:0;background:none;color:var(--sub);padding:6px 14px 9px;cursor:pointer;border-bottom:3px solid transparent;text-align:left;line-height:1.3}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav button small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
#asof{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;line-height:1.4}
@media (max-width:1180px){#asof{display:none}}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 20px;background:var(--bg);border-top:1px solid var(--line)}
.ctl label{color:var(--sub);font-size:12.5px;display:flex;align-items:center;gap:6px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:13.5px}
.search{position:relative;flex:1;min-width:220px;max-width:400px}
.search input{width:100%}
#results{position:absolute;z-index:2000;left:0;right:0;top:calc(100% + 2px);background:var(--card);border:1px solid var(--ink);border-radius:4px;max-height:320px;overflow:auto;display:none}
#results div{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
#results div:hover{background:var(--weak)}
#results small{color:var(--sub);display:block}

/* 몸 */
main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;min-height:300px;position:relative;background:#e3e7ea}
#map{position:absolute;inset:0}
.esri-view .esri-view-surface:focus::after{outline:none!important}
#tip{position:absolute;display:none;pointer-events:none;z-index:5;background:#16202a;color:#fff;padding:6px 9px;border-radius:4px;font-size:12.5px;white-space:nowrap}
#panel{width:540px;max-width:100%;overflow:auto;padding:22px 24px 40px;background:var(--card);border-left:1px solid var(--line)}
body.trend #mapwrap{display:none}
body.trend #panel{width:100%;border-left:0}
body.trend #panel>.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 36px}
body.trend .full{grid-column:1/-1}
@media (max-width:900px){body{height:auto}main{flex-direction:column}#mapwrap{height:46vh;flex:none}#panel{width:100%;border-left:0;padding:18px 16px 32px}body.trend #panel>.wrap{grid-template-columns:1fr}.top{gap:10px;padding:10px 16px 0}.ctl{padding:8px 16px}}

/* 글 */
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin:0 0 4px}
h2 .sub{font-size:14px;font-weight:500;letter-spacing:0}
h3,details.fold>summary{font-size:15px;font-weight:600;line-height:1.4;margin:30px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.sub{color:var(--sub);font-size:12.5px}
.note{font-size:12.5px;color:var(--sub);margin-top:8px;max-width:68ch}
.empty{padding:8px 0;max-width:42ch}
.empty h2{margin-bottom:10px}
.empty p{color:var(--sub);margin:0 0 10px}

/* 층·호 고르기 */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.chips button,.btn{font-size:12.5px;padding:4px 11px;border-radius:4px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.chips button:hover{border-color:var(--ink)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;font-size:13.5px;padding:8px 14px}
@media (prefers-color-scheme:dark){.btn.pri{color:#10151a}}

/* 판정: 도장 */
.verdict{display:flex;gap:16px;align-items:center;margin:18px 0 16px}
.verdict .stamp{flex:none;font-size:17px;font-weight:700;letter-spacing:.14em;padding:7px 9px 7px 12px;border:3px solid currentColor;border-radius:5px;transform:rotate(-5deg);line-height:1.2}
.verdict.warn .stamp{color:var(--stamp)}.verdict.ok .stamp{color:var(--open)}.verdict.hold .stamp{color:var(--sub)}
.verdict b{display:block;font-size:16px;font-weight:600;line-height:1.4;margin-bottom:2px}
.verdict p{margin:0;color:var(--sub);font-size:13px}

/* 숫자 줄: 상자 없이 대장처럼 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-top:12px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpi{padding:10px 12px 11px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0;padding-left:0}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--sub);line-height:1.4}
@media (max-width:900px){.kpis.k5{grid-template-columns:repeat(2,1fr)}.kpis.k5 .kpi:nth-child(odd){border-left:0;padding-left:0}.kpis.k5 .kpi{border-top:1px solid var(--line)}}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{color:var(--sub);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--card);border-bottom:1.5px solid var(--ink)}
th.s{color:var(--accent);font-weight:700}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--weak)}
tr.pick td{background:var(--weak);font-weight:600}
tr.pick td:first-child{box-shadow:inset 3px 0 var(--accent);padding-left:8px}
.scroll{max-height:440px;overflow:auto}

/* 그림 */
svg text{fill:var(--ink);font-size:11px;font-family:inherit}
svg .mut{fill:var(--sub)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin:6px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bchart{margin-bottom:14px}
.bchart .bt{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.bchart .bt i{width:8px;height:8px;border-radius:2px;display:inline-block}
.bars{display:grid;grid-template-columns:4.6em 1fr 2.6em;gap:5px 8px;font-size:12.5px;align-items:center;font-variant-numeric:tabular-nums}
.bars>span:nth-child(3n){text-align:right}
.bars .bar{height:10px;border-radius:0 4px 4px 0;min-width:2px;background:var(--accent)}
.bars .mx{font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}

/* 반응: 고른 것이 바뀔 때만 살짝 올라오고, 지도와 목록이 서로 강조된다 */
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
#panel.fresh>.wrap,#panel.fresh>.empty{animation:rise .22s ease-out}
@media (prefers-reduced-motion:reduce){#panel.fresh>.wrap,#panel.fresh>.empty{animation:none}}
tr.hov td{background:var(--weak)}
#results div.act{background:var(--weak);box-shadow:inset 3px 0 var(--accent)}
#busy{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:4;display:none;background:#16202a;color:#fff;font-size:12px;padding:4px 10px;border-radius:99px}
#hint{position:absolute;top:12px;right:12px;z-index:4;background:#fff;color:#16202a;border:1px solid #16202a;border-radius:4px;font-size:12px;padding:5px 9px;max-width:230px}
@media (max-width:900px){nav button small{display:none}nav button{padding:6px 10px 8px}.ctl{gap:8px}.ctl label{flex:1 1 44%}.ctl select{flex:1;min-width:0}.search{flex:1 1 100%;max-width:none;order:-1}.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:nth-child(odd){border-left:0;padding-left:0}.kpis .kpi:nth-child(n+3){border-top:1px solid var(--line)}.kpi .v{font-size:21px}#hint{display:none}}

/* 접어 둔 설명 */
.hsrc{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.srcb{flex:none;font:inherit;font-size:11px;font-weight:500;line-height:1;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 8px;cursor:pointer;margin-top:2px}
.srcb:hover,.srcb.on{color:var(--accent);border-color:var(--accent)}
.srcb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.srcb.mini{width:16px;height:16px;padding:0;font-size:10px;font-style:italic;font-family:Georgia,serif;margin-top:0}
.srcb.in{margin-left:auto;margin-top:0}
.srcbox{font-size:12.5px;line-height:1.55;color:var(--sub);background:color-mix(in srgb,var(--accent) 5%,var(--card));border-left:2px solid var(--accent);padding:9px 12px;margin:8px 0 10px;max-width:72ch}
.srcbox b{display:block;color:var(--ink);font-weight:600}
.srcbox b+ul{margin:2px 0 6px;padding-left:16px}.srcbox ul:last-child{margin-bottom:0}
.legend i.ln{width:14px;height:3px;border-radius:2px}
.yhit:hover{fill:var(--ink);fill-opacity:.05}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;white-space:nowrap}.chip i{width:9px;height:9px;border-radius:2px;flex:none}
.gstages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.gstages button{font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 11px 11px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 7px;align-items:center;color:var(--ink)}
.gstages button i{width:10px;height:10px;border-radius:2px}.gstages button .v{grid-column:1/-1;font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.gstages button .sub{grid-column:1/-1;line-height:1.45}
.gstages button:hover{border-color:var(--ink)}.gstages button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.gstages button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gverdict{display:flex;align-items:center;gap:16px;margin:14px 0 4px}.gverdict p{margin:0;max-width:52ch}
.gstamp{flex:none;font-size:16px;font-weight:700;letter-spacing:.06em;padding:6px 10px;border:3px solid currentColor;border-radius:5px;transform:rotate(-4deg)}
.rank{display:inline-block;width:84px;height:6px;border-radius:3px;background:var(--weak);vertical-align:middle;margin-right:8px;overflow:hidden}.rank div{height:100%;background:var(--accent);border-radius:3px}
button.back{font:inherit;font-size:12.5px;color:var(--accent);background:none;border:0;padding:0;margin:0 0 10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
tr.gup td{background:color-mix(in srgb,#e0412b 6%,var(--card))}
tr[data-area]{cursor:pointer}tr.apick td{box-shadow:inset 0 -2px #e0412b}
@media (max-width:900px){.gstages{grid-template-columns:repeat(2,1fr)}}
.prs{display:grid;gap:7px;margin-top:4px}.pr{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(70px,1.6fr) 44px minmax(70px,1fr);gap:10px;align-items:center;font-size:13px}.pr b{text-align:right;font-variant-numeric:tabular-nums}
.rank.wide{width:100%;height:10px;border-radius:5px;margin:0}.rank.wide div{border-radius:5px}
.cmpbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;margin:0 0 14px;background:var(--weak);border-radius:6px}
.chipx{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px}.chipx button{font:inherit;border:0;background:none;cursor:pointer;color:var(--sub);padding:0 5px;font-size:14px;line-height:1}.chipx button:hover{color:var(--ink)}
.cmpbar .btn{margin-left:auto}.btn:disabled{opacity:.5;cursor:default}
table.cmp td,table.cmp th{text-align:right}table.cmp td:first-child,table.cmp th:first-child{text-align:left;color:var(--sub)}td.bestc{font-weight:600;box-shadow:inset 0 -2px var(--accent)}
#share{margin-left:auto;align-self:center}
details.src{margin-top:10px;font-size:12.5px;color:var(--sub)}
details.src>summary{cursor:pointer;display:inline-block;text-decoration:underline dotted;text-underline-offset:3px}
details.src>summary::-webkit-details-marker{display:none}
details.src p{margin:6px 0 0;max-width:68ch}
details.fold>summary{cursor:pointer;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:" 펼치기";font-size:12.5px;font-weight:400;color:var(--accent);margin-left:6px}
details.fold[open]>summary::after{content:" 접기"}

.maplegend{position:absolute;left:12px;bottom:26px;z-index:4;background:#fff;color:#16202a;padding:8px 10px;border:1px solid #16202a;border-radius:4px;font-size:12px;line-height:1.65}
.maplegend b{font-weight:600}
.maplegend i{display:inline-block;width:10px;height:10px;margin-right:6px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>음식점 창업 지도<small>시제품</small></h1>
    <nav id="nav">
      <button data-t="region">지역 찾기<small>어느 동네가 좋을까</small></button>
      <button data-t="spot">자리 진단<small>이 자리는 괜찮을까</small></button>
      <button data-t="gent">동네 변화<small>어디가 뜨고 밀려나나</small></button>
      <button data-t="trend">업계 동향<small>이 종목은 요즘 어떤가</small></button>
    </nav>
    <button id="share" class="srcb" type="button" title="지금 보는 화면의 주소를 복사합니다">링크 복사</button>
  </div>
  <div class="ctl">
    <label>도시 <select id="reg"></select></label>
    <label class="c-region c-spot c-trend">창업 종목 <select id="upt"></select></label>
    <label class="c-region">지도 색칠 <select id="metric"><option value="surv">3년 생존율</option><option value="now">영업 중 점포 수</option><option value="net">최근 3년 순증감</option><option value="open1">작년 개업 수</option><option value="close1">작년 폐업 수</option><option value="crate">작년 폐업률</option><option value="sale">점포당 월매출(2025)</option><option value="yoy">매출 증감(전년 대비)</option><option value="rent">소규모 상가 임대료</option><option value="burden">임대료 부담률</option><option value="pop">유동인구</option><option value="ppl">점포당 유동인구</option><option value="res">상주인구</option><option value="wrk">직장인구</option></select></label>
    <label class="c-region c-spot c-gent">자치구 <select id="gu"></select></label>
    <div class="search c-region c-spot"><input id="q" placeholder="주소로 바로 찾기 (예: 독막로3길 24-9)" autocomplete="off" aria-label="주소 또는 상호 검색"><div id="results"></div></div>
    <label class="c-spot">주변 반경 <select id="rad"><option>200</option><option selected>300</option><option>500</option></select>m</label>
    <div id="asof"></div>
  </div>
</header>
<main>
  <div id="mapwrap"><div id="map"></div><div id="legend" class="maplegend"></div><div id="tip"></div><div id="busy">지도를 불러오는 중</div><div id="hint"></div></div>
  <div id="panel"></div>
</main>
<script src="https://js.arcgis.com/4.33/"></script>
<script src="data/summary.js"></script>
<script src="data/dong.js"></script>
<script src="data/sales.js"></script>
<script src="data/pop.js"></script>
<script src="data/rent.js"></script>
<script src="data/gent.js"></script>
<script src="data/people.js"></script>
<script src="data/succ.js"></script>
<script src="data/chain.js"></script>
<script src="data/subway.js"></script>
<script>
const S = window.SUM, NY = S.y1 - S.y0 + 1, $ = id => document.getElementById(id);
const KSIC = {56111:'한식 일반',56112:'한식 면요리',56113:'한식 육류요리',56114:'한식 해산물요리',56121:'중식',56122:'일식',56123:'서양식',56129:'기타 외국식',56130:'구내식당',56141:'출장 음식',56142:'이동 음식',56191:'제과점',56192:'피자·햄버거·샌드위치',56193:'치킨',56194:'김밥·간이음식',56199:'간이음식 포장판매',56211:'일반 유흥주점',56212:'무도 유흥주점',56213:'생맥주 전문점',56219:'기타 주점',56221:'커피 전문점',56229:'기타 비알코올 음료점'};
const U2K = {'한식':56111,'분식':56194,'커피숍':56221,'다방':56221,'호프/통닭':56219,'통닭(치킨)':56193,'일식':56122,'중국식':56121,'경양식':56123,'패스트푸드':56192,'정종/대포집/소주방':56219,'횟집':56114,'식육(숯불구이)':56113,'외국음식전문점(인도,태국등)':56129,'제과점영업':56191,'아이스크림':56229,'전통찻집':56229,'까페':56221,'라이브카페':56219};
const dstr = n => `${Math.floor(n/10000)}-${String(Math.floor(n/100)%100).padStart(2,'0')}-${String(n%100).padStart(2,'0')}`;
const day = n => Date.UTC(Math.floor(n/10000), Math.floor(n/100)%100-1, n%100)/864e5;
const CUT = day(S.cut), FROM = 20100101, SURV_TO = S.cut - 30000, POPUP = 90;
