# foodmap 자동 반영: 이 브랜치(codex/foodmap-deploy)에 push 되면 서버 러너가 IIS 폴더에 그대로 복사한다.
# 러너는 kgeosolution-lgtm/guri-gmap 저장소에 등록된 kgeodata-guri(라벨 guri-preview)를 쓴다.
name: Foodmap deployment
on:
  push:
    branches: [codex/foodmap-deploy]
permissions:
  contents: read
concurrency:
  group: foodmap-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install into IIS folder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($env:COMPUTERNAME -ne 'KGO-GIS') { throw 'Unexpected server' }
          $src = $env:GITHUB_WORKSPACE
          $target = 'D:\codesolution\kgeodata\foodmap'
          if (-not (Test-Path -LiteralPath (Join-Path $src 'index.html'))) { throw 'index.html missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $src 'data\summary.js'))) { throw 'data missing' }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          robocopy $src $target /MIR /XD .git .github /XF .gitattributes .gitignore /R:2 /W:2 /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw 'copy failed' }
          $n = (Get-ChildItem -LiteralPath $target -Recurse -File | Where-Object { $_.FullName -notmatch '\\\.git\\' }).Count
          "DEPLOYED files=$n commit=$env:GITHUB_SHA"
          exit 0
      - name: One-off check of leftovers on the server (temporary)
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $target = 'D:\codesolution\kgeodata\foodmap'
          $out = @()
          $q = cmd /c 'schtasks /Query /TN "foodmap-autopull" /FO LIST 2>&1'
          if ($LASTEXITCODE -eq 0) {
            $d = cmd /c 'schtasks /Delete /TN "foodmap-autopull" /F 2>&1'
            $out += "task foodmap-autopull: FOUND -> delete exit=$LASTEXITCODE $d"
          } else { $out += "task foodmap-autopull: none" }
          $other = cmd /c 'schtasks /Query /FO CSV /NH 2>nul' | Where-Object { $_ -match 'foodmap' }
          $out += "other tasks mentioning foodmap: " + $(if ($other) { ($other -join ' | ') } else { 'none' })
          foreach ($scope in '--system', '--global') {
            $s = cmd /c "git config $scope --get-all safe.directory 2>nul" | Where-Object { $_ -match 'foodmap' }
            if ($s) {
              cmd /c "git config $scope --unset-all safe.directory `"^D:/codesolution/kgeodata/foodmap$`" 2>&1" | Out-Null
              $out += "git safe.directory ($scope): FOUND -> unset exit=$LASTEXITCODE"
            } else { $out += "git safe.directory ($scope): none" }
          }
          $g = Join-Path $target '.git'
          if (Test-Path -LiteralPath $g) {
            $mb = [math]::Round(((Get-ChildItem -LiteralPath $g -Recurse -Force -File | Measure-Object Length -Sum).Sum / 1MB), 1)
            Remove-Item -LiteralPath $g -Recurse -Force -ErrorAction SilentlyContinue
            $out += ".git folder in site: FOUND ${mb}MB -> removed=" + (-not (Test-Path -LiteralPath $g))
          } else { $out += ".git folder in site: none" }
          $out | Set-Content -LiteralPath (Join-Path $target 'server-check.txt') -Encoding UTF8
          $out
          exit 0
